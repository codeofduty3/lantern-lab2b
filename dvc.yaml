# Case Study 2B pipeline. Rebuild with: dvc repro
# Stages: acquire -> parse -> clean -> reconcile -> report

stages:
  acquire:
    cmd: python scripts/acquire.py
    deps:
      - scripts/acquire.py
      - src/lookthrough/acquire.py
      - src/lookthrough/quarter.py
    params:
      - release
      - release_months
      - sec.base_url
    outs:
      - data/raw:
          persist: true
      - data/manifest.json:
          cache: false

  parse:
    cmd: python scripts/parse.py
    deps:
      - scripts/parse.py
      - src/lookthrough/clean.py
      - src/lookthrough/load.py
      - src/lookthrough/mapping.py
      - src/lookthrough/holdings.py
      - src/lookthrough/coalesce.py
      - data/raw
    params:
      - release
    outs:
      - outputs/canonical/holdings.parquet
      - reports/periods.csv:
          cache: false
      - reports/conflicts.csv:
          cache: false

  clean:
    cmd: python scripts/clean.py
    deps:
      - scripts/clean.py
      - src/lookthrough/clean.py
      - src/lookthrough/load.py
      - src/lookthrough/mapping.py
      - src/lookthrough/reconcile.py
      - src/lookthrough/tables.py
      - outputs/canonical/holdings.parquet
      - data/raw
    params:
      - release
      - reconcile.tolerance
    outs:
      - outputs/cleaned/holdings.parquet:
          cache: false
      - reports/cleaning_log.csv:
          cache: false

  reconcile:
    cmd: python scripts/reconcile.py
    deps:
      - scripts/reconcile.py
      - src/lookthrough/clean.py
      - src/lookthrough/holdings.py
      - src/lookthrough/load.py
      - src/lookthrough/mapping.py
      - src/lookthrough/reconcile.py
      - src/lookthrough/tables.py
      - outputs/canonical/holdings.parquet
      - outputs/cleaned/holdings.parquet
      - data/raw
    params:
      - release
      - reconcile.tolerance
    outs:
      - outputs/reconciled/holdings.parquet:
          cache: false
      - outputs/reconciled/rec.parquet:
          cache: false
      - outputs/reconciled/diag.parquet:
          cache: false
      - outputs/reconciled/no_soi.parquet:
          cache: false

  report:
    cmd: python scripts/report.py
    deps:
      - scripts/report.py
      - src/lookthrough/paths.py
      - src/lookthrough/reconcile.py
      - src/lookthrough/report.py
      - src/lookthrough/tables.py
      - outputs/cleaned/holdings.parquet
      - outputs/reconciled/rec.parquet
      - outputs/reconciled/diag.parquet
      - outputs/reconciled/no_soi.parquet
      - reports/cleaning_log.csv
      - docs/triage_notes.csv
    outs:
      - outputs/panel/holdings.parquet
      - reports/coverage.csv:
          cache: false
      - reports/coverage.md:
          cache: false
      - reports/triage.md:
          cache: false
    metrics:
      - reports/coverage.json:
          cache: false
