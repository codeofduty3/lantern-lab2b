# Case Study 2B pipeline (Part 5). Rebuild everything with:  dvc repro
# Stages: acquire -> parse -> clean -> reconcile -> report
# (clean is added when Part 2 is ready; reconcile also writes the Part 3 reports)

stages:
  acquire:
    cmd: python scripts/acquire.py
    deps:
      - scripts/acquire.py
      - src/lookthrough/acquire.py
      - src/lookthrough/quarter.py
    params:
      - release
      - release_months
      - sec.base_url
    outs:
      - data/raw:
          persist: true       # keep the ZIPs between runs: acquire.py skips months already downloaded
      - data/manifest.json:
          cache: false        # small, committed to Git as the Part 0 deliverable

  parse:
    cmd: python scripts/parse.py
    deps:
      - scripts/parse.py
      - src/lookthrough/clean.py
      - src/lookthrough/load.py
      - src/lookthrough/mapping.py
      - src/lookthrough/holdings.py
      - src/lookthrough/coalesce.py
      - data/raw
    params:
      - release
    outs:
      - outputs/canonical/holdings.parquet
      - reports/periods.csv:
          cache: false
      - reports/conflicts.csv:
          cache: false

  reconcile:
    cmd: python scripts/reconcile.py
    deps:
      - scripts/reconcile.py
      - src/lookthrough/clean.py
      - src/lookthrough/reconcile.py
      - src/lookthrough/report.py
      - docs/triage_notes.csv
      - outputs/canonical/holdings.parquet
      - data/raw
    params:
      - release
      - reconcile.tolerance
    outs:
      - outputs/panel/holdings.parquet
      - reports/coverage.csv:
          cache: false
      - reports/coverage.md:
          cache: false
      - reports/triage.md:
          cache: false
      - reports/cleaning_log.csv:
          cache: false
    metrics:
      - reports/coverage.json:
          cache: false
